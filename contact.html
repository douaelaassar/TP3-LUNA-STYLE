    <meta charset="UTF-8">

    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">LUNA STYLE</a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Accueil</a>
                    </li>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="page-header text-center">
        <div class="container">
            <h1>Contactez-nous</h1>
            <p>Une question ? Nous sommes à votre écoute.</p>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="contact-box">
                    <h2 class="text-center mb-4">Envoyez-nous un message</h2>

                    <form id="contactForm">
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom complet</label>
                            <input type="text" class="form-control"
                                id="nom" placeholder="Votre nom" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Adresse e-mail</label>
                            <input type="email" class="form-control"
                                id="email" placeholder="exemple@email.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="message" class="form-label">Votre message</label>
                            <textarea class="form-control" id="message"
                                rows="5" placeholder="Écrivez votre message..."
                                required></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark w-100">
                            Envoyer le message
                        </button>
                    </form>

                    <div id="confirmation" class="alert alert-success mt-3 d-none">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer text-center">
        <p class="mb-0">© 2026 LUNA STYLE — Tous droits réservés.</p>
    </footer>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
